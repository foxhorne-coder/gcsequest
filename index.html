s the main purpose of mitosis?","Growth and repair",["Making gametes","Digestion","Photosynthesis"]],["Cell biology","Which process moves particles from high to low concentration?","Diffusion",["Active transport","Filtration","Respiration"]],["Bioenergetics","Which gas is a reactant in photosynthesis?","Carbon dioxide",["Oxygen","Nitrogen","Hydrogen"]],["Organisation","What do enzymes do?","Catalyse biological reactions",["Store genetic information","Carry oxygen only","Make cells divide"]],["Ecology","What is a producer?","An organism that makes its own food",["An organism that eats plants","A decomposer","A predator"]]],"chemistry":[["Atomic structure","What is the relative charge of a proton?","+1",["0","-1","+2"]],["Bonding","What type of bonding occurs between oppositely charged ions?","Ionic",["Metallic","Covalent","Hydrogen"]],["Rates","What does a catalyst do?","Increases reaction rate without being used up",["Increases mass","Stops every reaction","Always increases equilibrium yield"]],["Chemical analysis","What happens in the test for hydrogen?","A lit splint gives a squeaky pop",["Limewater turns cloudy","A glowing splint relights","Blue litmus turns red"]],["Organic chemistry","What is crude oil?","A mixture of hydrocarbons",["A pure hydrocarbon","A metal ore","A salt"]],["Chemical changes","What happens at the cathode during electrolysis?","Positive ions gain electrons",["Negative ions gain electrons","Atoms lose neutrons","Molecules evaporate"]]],"physics":[["Energy","What is the equation linking energy transferred, power and time?","E = Pt",["E = P/t","P = Et","E = t/P"]],["Electricity","What is the unit of current?","Ampere (A)",["Volt (V)","Ohm (Ω)","Joule (J)"]],["Forces","What is the unit of force?","Newton (N)",["Watt (W)","Pascal (Pa)","Coulomb (C)"]],["Atomic structure","Which radiation is most ionising?","Alpha",["Beta","Gamma","Visible light"]],["Waves","Which electromagnetic wave has the highest frequency?","Gamma rays",["Radio waves","Microwaves","Infrared"]],["Forces","What is momentum equal to?","mass × velocity",["mass ÷ velocity","force × distance","energy ÷ time"]]],"maths":[["Number","What is 25% as a fraction in its simplest form?","1/4",["1/5","1/3","2/5"]],["Algebra","Solve: 3x = 18","x = 6",["x = 3","x = 9","x = 21"]],["Algebra","What is the gradient of y = 4x + 2?","4",["2","-4","6"]],["Probability","What is the probability of a fair coin landing heads?","1/2",["1/4","1","2"]],["Geometry","A right-angled triangle has sides 3 and 4 around the right angle. What is the hypotenuse?","5",["6","7","12"]],["Statistics","Which average is the middle value when data are ordered?","Median",["Mean","Mode","Range"]]],"further-maths":[["Algebra","What is the gradient of y = 3x + 2?","3",["2","-3","1"]],["Number","Which expression is a surd?","√2",["4","0.25","2/3"]],["Coordinate geometry","What is the midpoint of (2,4) and (6,8)?","(4,6)",["(3,5)","(8,12)","(2,6)"]],["Calculus","What is the derivative of x²?","2x",["x","x²","2"]],["Matrix transformations","A matrix is best described as what?","A rectangular array of numbers",["A single number","A graph","An equation only"]],["Geometry","What is sin²θ + cos²θ equal to?","1",["0","2","θ"]]]}}
let user=JSON.parse(localStorage.getItem('gq_user')||'null');
let state=JSON.parse(localStorage.getItem('gq_state')||'{"xp":0,"tests":0,"best":0,"progress":{}}');
let quizTimer=null;
let settings=Object.assign({theme:'cream',font:'Inter',mode:'light',density:'comfortable',animations:true,sound:'off',volume:.35,defaultYear:10,favourites:[]},JSON.parse(localStorage.getItem('gq_settings')||'{}'));
let studyAudio=null;
function applySettings(sync=true){document.body.dataset.theme=settings.theme;document.body.dataset.font=settings.font;document.body.dataset.mode=settings.mode;document.body.dataset.density=settings.density;document.body.classList.toggle('noAnim',!settings.animations);localStorage.setItem('gq_settings',JSON.stringify(settings));if(sync&&window.gqSaveSettings)window.gqSaveSettings();}
applySettings(false);

function save(){localStorage.setItem('gq_state',JSON.stringify(state));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function totalSubs(){return Object.values(DATA.subjects).reduce((n,s)=>n+s.topics.reduce((a,t)=>a+t[1].length,0),0);}
function home(){
 app.innerHTML=`<section class="hero"><div class="pill">AQA GCSE · 8461 · 8462 · 8463 · 8300</div>
 <h1>Your GCSEs.<br><em>One place.</em></h1>
 <p>Learn by topic, practise by subtopic, take timed tests, earn XP and track your progress.</p>
 <div class="actions"><button class="primary" onclick="subjectsPage()">Start revising →</button><button class="ghost" onclick="testsPage()">Take a test</button></div></section>
 <section class="stats"><div><b>${totalSubs()}</b><span>subtopics mapped</span></div><div><b>${state.xp}</b><span>your XP</span></div><div><b>${state.tests}</b><span>tests completed</span></div></section>
 <h2 class="sectionTitle">Choose a subject</h2><section class="subjectGrid">${Object.entries(DATA.subjects).map(([id,s])=>card(id,s)).join('')}</section>
 <section class="feature"><div><span>01</span><h3>Learn</h3><p>Use topic and subtopic pages as your revision checklist.</p></div><div><span>02</span><h3>Test</h3><p>Choose a topic, subject, difficulty and timer.</p></div><div><span>03</span><h3>Compete</h3><p>Earn XP and climb the scoreboard.</p></div></section>`;
}
function card(id,s){return `<article class="subject ${id}"><div class="subjectIcon">${s.icon}</div><small>AQA ${s.spec}</small><h2>${s.title}</h2><p>${s.topics.length} topics · ${s.topics.reduce((a,t)=>a+t[1].length,0)} subtopics</p><button onclick="subjectPage('${id}')">Open →</button></article>`}
function subjectsPage(){app.innerHTML=`<section class="head"><div class="pill">THE COURSE</div><h1>Subjects</h1><p>Pick a subject, then drill down into topics and subtopics.</p><div class="actions"><button class="primary" onclick="yearPage(10)">Year 10 view →</button><button class="ghost" onclick="yearPage(11)">Year 11 view →</button><button class="ghost" onclick="topicsPage()">Revision tracker →</button></div></section><section class="subjectGrid">${Object.entries(DATA.subjects).map(([id,s])=>card(id,s)).join('')}</section>`}
function suggestedYear(id,i){ if(id==='further-maths') return 11; const split=Math.ceil(DATA.subjects[id].topics.length/2); return i<split?10:11; }
function yearPage(year){const items=[];Object.entries(DATA.subjects).forEach(([id,s])=>{const topics=s.topics.map((t,i)=>[t,i]).filter(([,i])=>suggestedYear(id,i)===year);if(topics.length)items.push(`<section class="yearBlock"><div class="yearSubject"><span>${s.icon}</span><div><h2>${s.title}</h2><small>AQA ${s.spec} · suggested Year ${year} coverage</small></div><button class="ghost" onclick="subjectPage('${id}')">Full subject →</button></div><div class="yearTopics">${topics.map(([t,i])=>{const done=t[1].filter((_,j)=>state.progress[id+'-'+i+'-'+j]).length;return `<article class="yearTopic"><div><b>${t[0]}</b><span>${done}/${t[1].length} revised</span></div><div class="tinyBar"><i style="width:${t[1].length?done/t[1].length*100:0}%"></i></div><button class="mini" onclick="subjectPage('${id}')">Open →</button></article>`}).join('')}</div></section>`)});app.innerHTML=`<section class="head"><div class="pill">FILTERED COURSE VIEW</div><h1>Year ${year}</h1><p>A quick way to focus on one school year. AQA specifications are linear, so this is a <strong>GCSEQuest suggested split</strong>, not an official AQA Year 10/11 division.</p></section>${items.join('')}`}
function topicsPage(){const total=totalSubs(),done=Object.values(state.progress).filter(Boolean).length,subjects=Object.entries(DATA.subjects);app.innerHTML=`<section class="head"><div class="pill">REVISION TRACKER</div><h1>Topics</h1><p>See what you've revised, what's in progress and what still needs work.</p><div class="trackerSummary"><div><b>${done}</b><span>revised</span></div><div><b>${total-done}</b><span>not revised</span></div><div><b>${total?Math.round(done/total*100):0}%</b><span>overall</span></div></div></section><div class="filters"><label>Year<select id="topicYear" onchange="renderTracker()"><option value="all">All years</option><option value="10">Year 10</option><option value="11">Year 11</option></select></label><label>Subject<select id="topicSubject" onchange="renderTracker()"><option value="all">All subjects</option>${subjects.map(([id,s])=>`<option value="${id}">${s.title}</option>`).join('')}</select></label><label>Status<select id="topicStatus" onchange="renderTracker()"><option value="all">All</option><option value="done">Revised</option><option value="todo">Not revised</option></select></label></div><div id="trackerList"></div>`;renderTracker()}
function renderTracker(){const y=document.getElementById('topicYear')?.value||'all',subj=document.getElementById('topicSubject')?.value||'all',status=document.getElementById('topicStatus')?.value||'all';let html='';Object.entries(DATA.subjects).forEach(([id,s])=>{if(subj!=='all'&&subj!==id)return;let rows='';s.topics.forEach((t,ti)=>{const year=suggestedYear(id,ti);if(y!=='all'&&+y!==year)return;t[1].forEach((sub,si)=>{const key=id+'-'+ti+'-'+si,done=!!state.progress[key];if(status==='done'&&!done||status==='todo'&&done)return;rows+=`<div class="trackerRow"><div class="statusDot ${done?'done':''}"></div><div class="trackerName"><b>${esc(sub)}</b><small>${esc(t[0])} · ${s.title} · Year ${year}</small></div><span class="statusText ${done?'done':''}">${done?'REVISED':'NOT REVISED'}</span><button class="mini" onclick="lesson('${id}',${ti},${si})">Open</button></div>`})});if(rows)html+=`<section class="trackerSubject"><h2>${s.icon} ${s.title}</h2>${rows}</section>`});document.getElementById('trackerList').innerHTML=html||'<div class="panel"><h2>No topics match those filters.</h2></div>'}

function subjectPage(id){
 const s=DATA.subjects[id];
 app.innerHTML=`<section class="head"><div class="pill">${s.icon} AQA ${s.spec}</div><h1>${s.title}</h1><p>Select a subtopic to revise, or test yourself on a whole topic.</p><button class="primary" onclick="setupTest('${id}','all')">Test whole subject →</button></section>
 <section class="topics">${s.topics.map((t,i)=>`<article class="topic"><div class="topicNo">${String(i+1).padStart(2,'0')}</div><div><h2>${t[0]}</h2><div class="subchips">${t[1].map((x,j)=>{const done=!!state.progress[id+'-'+i+'-'+j];return `<button class="${done?'revisedChip':''}" onclick="lesson('${id}',${i},${j})">${done?'✓ ':''}${x}</button>`}).join('')}</div></div><button class="mini" onclick="setupTest('${id}',${i})">Test topic</button></article>`).join('')}</section>`;
}
function lesson(id,ti,si){
 const s=DATA.subjects[id],t=s.topics[ti],sub=t[1][si],key=id+'-'+ti+'-'+si,done=!!state.progress[key];
 app.innerHTML=`<section class="head"><div class="pill">${esc(s.title)} · ${esc(t[0])}</div><h1>${esc(sub)}</h1><p>Learn it, explore it, recall it, then test yourself.</p></section>
 <div class="lessonTabs"><button class="tab active" onclick="lessonTab('learn')">📖 Learn</button><button class="tab" onclick="lessonTab('diagram')">🧩 Diagram</button><button class="tab" onclick="lessonTab('interactive')">🎮 Interactive</button><button class="tab" onclick="lessonTab('flashcards')">🧠 Flashcards</button><button class="tab" onclick="lessonTab('check')">✅ Quick check</button></div>
 <section id="lessonContent" class="lessonContent"></section>
 <section class="panel progressPanel"><label><input id="done" type="checkbox" ${done?'checked':''}> Mark this subtopic as revised</label><button class="primary" onclick="markProgress('${key}')">Save progress</button><button class="ghost" onclick="topicsPage()">View revision tracker →</button><button class="ghost" onclick="setupTest('${id}',${ti})">Test this topic →</button></section>`;
 lessonTab('learn');
}
function lessonTab(tab){
 const box=document.getElementById('lessonContent'); if(!box)return;
 const id=Object.keys(DATA.subjects).find(k=>DATA.subjects[k].topics.some(t=>t[1].includes(document.querySelector('.head h1')?.textContent)));
 const sub=document.querySelector('.head h1')?.textContent||'this subtopic';
 if(tab==='learn') box.innerHTML=`<div class="lessonGrid"><article class="panel"><span class="lessonIcon">📖</span><h2>Learn</h2><p>Build a clear understanding of <strong>${esc(sub)}</strong>. Focus on the exact definitions, processes, equations, diagrams and applications required by your course.</p><div class="studySteps"><div><b>1 · Understand</b><span>Read the explanation and identify the key idea.</span></div><div><b>2 · Explain</b><span>Say it in your own words without looking.</span></div><div><b>3 · Apply</b><span>Use it in an unfamiliar problem or example.</span></div></div><p class="sourceNote">This build provides the interactive framework for every subtopic. Subject-specific lesson text should be checked against your AQA specification and class resources.</p></article><article class="panel"><span class="lessonIcon">🎯</span><h2>Mastery checklist</h2><label class="checkrow"><input type="checkbox"> I know the key vocabulary</label><label class="checkrow"><input type="checkbox"> I can explain the idea</label><label class="checkrow"><input type="checkbox"> I can use it in a question</label><label class="checkrow"><input type="checkbox"> I can recall the formula/method</label><label class="checkrow"><input type="checkbox"> I can explain a common mistake</label></article></div>`;
 if(tab==='diagram') box.innerHTML=`<article class="panel"><h2>Interactive diagram</h2><p>Tap each stage to reveal how to revise <strong>${esc(sub)}</strong>.</p><div class="conceptDiagram"><button onclick="revealDiagram(0)">KEY IDEA</button><span>→</span><button onclick="revealDiagram(1)">METHOD</button><span>→</span><button onclick="revealDiagram(2)">APPLICATION</button></div><div id="diagramReveal" class="revealBox">Choose a part of the diagram.</div><p class="sourceNote">This is a visual organiser; exact subject facts are to be verified against AQA course materials.</p></article>`;
 if(tab==='interactive') box.innerHTML=`<article class="panel"><h2>Interactive revision lab</h2><p>Work through four active-recall stages for <strong>${esc(sub)}</strong>.</p><div class="interactiveCard"><div class="progressTrack"><span id="labBar"></span></div><h3 id="labTitle">Step 1 — Recall</h3><p id="labText">Say or write three things you remember before checking your notes.</p><button class="primary" onclick="nextLab()">Next step →</button></div><div id="labScore" class="miniScore">Step 1 of 4</div></article>`;
 if(tab==='flashcards') box.innerHTML=`<article class="panel"><h2>Flashcard</h2><div class="flashcard" onclick="flipCard(this)"><div class="front">What do you need to remember about <strong>${esc(sub)}</strong>?</div><div class="back">Think about: definition → process/method → formula/evidence → application → common mistake.</div></div><p class="hint">Tap to flip.</p></article>`;
 if(tab==='check') box.innerHTML=`<article class="panel"><h2>Quick check</h2><p>Try a question, then reveal whether you were right.</p><div class="questionCard"><h3>Can you explain <strong>${esc(sub)}</strong> without looking at your notes?</h3><button class="primary" onclick="showRecall()">Reveal checklist</button><div id="checkResult"></div></div></article>`;
}
function revealDiagram(n){const m=["State the central definition, quantity or process.","Break it into the steps, relationships or method.","Connect it to an exam question, example or calculation."];const e=document.getElementById('diagramReveal');if(e)e.innerHTML='<strong>'+["Key idea","Method","Application"][n]+'</strong><br>'+m[n];}
let labStep=1;
function nextLab(){labStep=labStep%4+1;const t=["Recall","Explain","Apply","Exam check"],x=["Say three facts without notes.","Explain the idea as if teaching it.","Create or solve a simple example.","Name one exam mistake to avoid."];document.getElementById('labTitle').textContent=`Step ${labStep} — ${t[labStep-1]}`;document.getElementById('labText').textContent=x[labStep-1];document.getElementById('labScore').textContent=`Step ${labStep} of 4`;document.getElementById('labBar').style.width=(labStep*25)+'%';}
function flipCard(el){el.classList.toggle('flipped')}
function showRecall(){document.getElementById('checkResult').innerHTML='<div class="revealBox">If you can define it, explain it, apply it and identify a common mistake, you are much closer to mastery.</div>';}

function markProgress(k){state.progress[k]=document.getElementById('done').checked;save();toast(state.progress[k]?'Marked as revised ✓':'Marked as not revised');if(window.gqSaveProgress)window.gqSaveProgress();}
function pastPapersPage(){const papers=[['biology','🧬','Biology','8461'],['chemistry','⚗️','Chemistry','8462'],['physics','⚡','Physics','8463'],['maths','📐','Mathematics','8300'],['further-maths','∑','Further Mathematics','8365']];app.innerHTML=`<section class="head"><div class="pill">EXAM PRACTICE</div><h1>Past Papers</h1><p>Find official AQA question papers, mark schemes and examiner reports. GCSEQuest links to AQA rather than hosting copied exam PDFs.</p><a class="paperFinder" href="https://www.aqa.org.uk/past-papers-and-mark-schemes-finder" target="_blank" rel="noopener">Open AQA Past Paper Finder ↗</a></section><section class="paperGrid">${papers.map(p=>`<article class="paperCard"><span>${p[1]}</span><h2>${p[2]}</h2><p>AQA ${p[3]}</p><a href="https://www.aqa.org.uk/subjects/${p[0]==='further-maths'?'mathematics/aqa-certificate/mathematics-8365':p[0]+'?utm_source=gcsequest'}" target="_blank" rel="noopener">AQA subject resources ↗</a></article>`).join('')}</section><div class="panel note"><b>What you can find</b><p>Use AQA's finder to filter by subject and exam series. AQA says most past papers and mark schemes remain available online for three years because of copyright restrictions.</p></div>`}
function testsPage(){app.innerHTML=`<section class="head"><div class="pill">PRACTICE</div><h1>Tests</h1><p>Build a test from a subject, topic or the entire course.</p></section><section class="testChoices">${Object.entries(DATA.subjects).map(([id,s])=>`<div class="testChoice"><span>${s.icon}</span><div><h2>${s.title}</h2><p>AQA ${s.spec}</p></div><button class="primary" onclick="setupTest('${id}','all')">Build test →</button></div>`).join('')}<div class="testChoice special"><span>🎲</span><div><h2>Mixed GCSE</h2><p>Questions from all four subjects</p></div><button class="primary" onclick="setupTest('mixed','all')">Build test →</button></div></section>`}
function setupTest(id,topic){
 const s=id==='mixed'?null:DATA.subjects[id];
 app.innerHTML=`<section class="head"><div class="pill">TEST BUILDER</div><h1>Build your test</h1><p>${s?s.title:'Mixed GCSE'} · choose your settings.</p>
 <section class="builder"><label>Number of questions<select id="num"><option>5</option><option>10</option><option>20</option></select></label>
 <label>Time limit<select id="time"><option value="0">No timer</option><option value="60">1 minute</option><option value="180">3 minutes</option><option value="300">5 minutes</option><option value="600">10 minutes</option></select></label>
 <label>Difficulty<select id="diff"><option>Standard</option><option>Foundation</option><option>Higher</option></select></label>
 <button class="primary" onclick="startTest('${id}','${topic}')">Start test →</button></section></section>`;
}
function startTest(id,topic){
 let pool=id==='mixed'?Object.values(DATA.questions).flat():DATA.questions[id].slice();
 if(id!=='mixed'&&topic!=='all') pool=pool.filter(q=>q[0].toLowerCase().includes(DATA.subjects[id].topics[topic][0].toLowerCase().split(' ')[0]));
 if(!pool.length) pool=id==='mixed'?Object.values(DATA.questions).flat():DATA.questions[id];
 const n=Math.min(+document.getElementById('num').value||5,pool.length); pool=pool.sort(()=>Math.random()-.5).slice(0,n);
 const secs=+document.getElementById('time').value; let left=secs, index=0,score=0;
 function render(){
  if(index>=pool.length){finishTest(score,pool.length,id);return}
  const q=pool[index], opts=[q[2],...q[3]].sort(()=>Math.random()-.5);
  app.innerHTML=`<section class="quiz"><div class="quizTop"><span>${index+1} / ${pool.length}</span><span id="timer">${secs?fmt(left):'No timer'}</span></div><div class="bar"><i style="width:${index/pool.length*100}%"></i></div><small>${esc(q[0])}</small><h1>${esc(q[1])}</h1><div class="answers">${opts.map(o=>`<button onclick="answer(this,${JSON.stringify(o===q[2])})">${esc(o)}</button>`).join('')}</div></section>`;
 }
 window.answer=(btn,correct)=>{document.querySelectorAll('.answers button').forEach(b=>b.disabled=true);btn.classList.add(correct?'right':'wrong');if(correct)score++;setTimeout(()=>{index++;render()},450)};
 if(secs){quizTimer=setInterval(()=>{left--;const el=document.getElementById('timer');if(el)el.textContent=fmt(left);if(left<=0){clearInterval(quizTimer);finishTest(score,pool.length,id)}},1000)}
 render();
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function finishTest(score,total,id){
 if(quizTimer)clearInterval(quizTimer); const xp=score*100;state.xp+=xp;state.tests++;state.best=Math.max(state.best,score/total);save();if(window.gqRecordTest)window.gqRecordTest(xp,id);else if(window.gqSaveProgress)window.gqSaveProgress();
 app.innerHTML=`<section class="result"><div class="pill">TEST COMPLETE</div><h1>${score}/${total}</h1><div class="xp">+${xp} XP</div><p>${score===total?'Perfect score. 🔥':score/total>=.7?'Great work. Keep pushing.':'Good attempt. Revise the weak areas and try again.'}</p><button class="primary" onclick="testsPage()">Another test</button><button class="ghost" onclick="leaderboard()">Scoreboard</button></section>`;
}
let leaderboardMode='all';
function leaderboard(){
 const tabs=[['all','🌍 Global'],['week','📅 This Week'],['biology','🧬 Biology'],['chemistry','⚗️ Chemistry'],['physics','⚡ Physics'],['maths','📐 Maths'],['further-maths','∑ Further Maths']];
 app.innerHTML=`<section class="head"><div class="pill">COMPETITION</div><h1>🏆 Scoreboard</h1><p>A real GCSEQuest leaderboard. Only signed-in accounts with XP appear here.</p></section><div class="boardControls">${tabs.map(([k,l])=>`<button class="boardTab ${leaderboardMode===k?'active':''}" onclick="loadLeaderboard('${k}')">${l}</button>`).join('')}</div><div id="leaderboardArea"><div class="panel"><h3>Loading leaderboard…</h3><p>Fetching the latest scores.</p></div></div><section class="panel friendFinder"><div><span class="eyebrow">FRIENDS</span><h2>🔎 Find your friends</h2><p>Search public GCSEQuest profiles by display name. Email addresses are never shown.</p></div><div class="friendSearch"><input id="friendSearchInput" placeholder="Search a name…" autocomplete="off" onkeydown="if(event.key==='Enter')searchFriends()"><button class="primary" onclick="searchFriends()">Search</button></div><div id="friendResults"></div><div id="socialArea"><p class="searchHint">Sign in to see your friends and friend requests.</p></div></section>`;

}
async function loadLeaderboard(mode='all'){
 leaderboardMode=mode;
 document.querySelectorAll('.boardTab').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')===`loadLeaderboard('${mode}')`));
 const area=document.getElementById('leaderboardArea'); if(!area)return;
 area.innerHTML='<div class="panel"><h3>Loading leaderboard…</h3><p>Fetching the latest scores.</p></div>';
 try{
   if(!window.gqGetLeaderboard)throw new Error('Firebase leaderboard is not ready');
   const rows=await window.gqGetLeaderboard(mode);
   if(!rows.length){area.innerHTML='<div class="panel"><h3>No scores yet</h3><p>Be one of the first people to earn XP.</p></div>';return;}
   const uid=window.gqGoogleUser?.uid; const rank=uid?rows.findIndex(x=>x.uid===uid)+1:0;
   area.innerHTML=`<div class="board">${rows.slice(0,50).map((r,i)=>`<div class="row ${r.uid===uid?'youRow':''}"><b>#${i+1}</b><div class="leaderPerson">${r.photoURL?`<img src="${esc(r.photoURL)}" alt="">`:'<span class="avatarTiny">👤</span>'}<span>${esc(r.displayName)}${r.uid===uid?' <small>(you)</small>':''}</span></div><strong>${Number(r.score).toLocaleString()} XP</strong></div>`).join('')}</div>${rank>50?`<div class="panel yourRank"><b>Your rank</b><strong>#${rank} · ${Number(rows[rank-1].score).toLocaleString()} XP</strong></div>`:''}`;
 }catch(e){console.error(e);area.innerHTML='<div class="panel"><h3>Leaderboard unavailable</h3><p>Please sign in with Google and make sure Firebase is connected.</p><button class="primary" onclick="profile()">Sign in</button></div>';}
}
async function searchFriends(){
 const input=document.getElementById('friendSearchInput'),out=document.getElementById('friendResults'); if(!input||!out)return;
 const q=input.value.trim(); if(q.length<2){out.innerHTML='<p class="searchHint">Enter at least 2 characters.</p>';return;}
 out.innerHTML='<p class="searchHint">Searching…</p>';
 try{const results=await window.gqSearchUsers(q);if(!results.length){out.innerHTML='<p class="searchHint">No public profiles found.</p>';return;}
   out.innerHTML=`<div class="friendResults">${results.slice(0,12).map(u=>`<article class="friendResult"><div class="leaderPerson">${u.photoURL?`<img src="${esc(u.photoURL)}" alt="">`:'<span class="avatarTiny">👤</span>'}<div><b>${esc(u.displayName)}</b><small>${Number(u.xp||0).toLocaleString()} XP</small></div></div><button class="ghost" onclick="viewPublicProfile('${esc(u.uid)}')">View profile</button></article>`).join('')}</div>`;

}

 try{const u=await window.gqGetPublicProfile(uid);if(!u)return toast('Profile not found');
   const isMe=window.gqGoogleUser?.uid===uid;

 }catch(e){console.error(e);toast('Could not open profile');}

async function sendFriendRequest(uid){
 if(!window.gqGoogleUser){toast('Sign in to add friends');return;}
 try{await window.gqSendFriendRequest(uid);toast('Friend request sent ✓');await loadSocial();}catch(e){console.error(e);toast(e.message||'Could not send friend request');}

async function loadSocial(){
 const area=document.getElementById('socialArea'); if(!area||!window.gqGetSocial)return;
 if(!window.gqGoogleUser){area.innerHTML='<p class="searchHint">Sign in to see your friends and friend requests.</p>';return;}
 try{const data=await window.gqGetSocial();
   area.innerHTML=`<div class="socialGrid"><div><h3>Friend requests ${data.incoming.length?`(${data.incoming.length})`:''}</h3>${data.incoming.length?data.incoming.map(r=>`<div class="friendResult"><div><b>${esc(r.senderName||'Student')}</b><small>Wants to be your friend</small></div><button class="primary" onclick="acceptFriendRequest('${esc(r.id)}')">Accept</button></div>`).join(''):'<p class="searchHint">No new requests.</p>'}</div><div><h3>Your friends ${data.friends.length?`(${data.friends.length})`:''}</h3>${data.friends.length?data.friends.map(f=>`<div class="friendResult"><div><b>${esc(f.displayName||'Student')}</b><small>${Number(f.xp||0).toLocaleString()} XP</small></div><button class="ghost" onclick="viewPublicProfile('${esc(f.uid)}')">View</button></div>`).join(''):'<p class="searchHint">No friends yet.</p>'}</div></div>`;
 }catch(e){console.error(e);area.innerHTML='<p class="searchHint">Friends are temporarily unavailable.</p>';}

async function acceptFriendRequest(id){try{await window.gqAcceptFriendRequest(id);toast('Friend added ✓');await loadSocial();}catch(e){console.error(e);toast(e.message||'Could not accept request');}}
function dashboard(){
 const total=totalSubs(),done=Object.values(state.progress).filter(Boolean).length,pct=total?Math.round(done/total*100):0;
 const subjectStats=Object.entries(DATA.subjects).map(([id,s])=>{let all=s.topics.reduce((a,t)=>a+t[1].length,0),d=0;s.topics.forEach((t,ti)=>t[1].forEach((_,si)=>{if(state.progress[id+'-'+ti+'-'+si])d++}));return [id,s,all,d,all?Math.round(d/all*100):0]});
 const weak=subjectStats.slice().sort((a,b)=>a[4]-b[4]).slice(0,2);
 app.innerHTML=`<section class="head"><div class="pill">YOUR REVISION</div><h1>My Revision</h1><p>${window.gqGoogleUser?`Welcome back, ${esc(window.gqGoogleUser.displayName||'Student')}.`:'Your progress is stored on this device until you sign in.'}</p></section><section class="dashboardHero"><div><span class="eyebrow">OVERALL PROGRESS</span><div class="bigPercent">${pct}%</div><p>${done} of ${total} subtopics revised</p></div><div class="circleProgress" style="--pct:${pct*3.6}deg"><span>${pct}%</span></div></section><section class="stats"><div><b>${state.xp.toLocaleString()}</b><span>XP</span></div><div><b>${state.tests}</b><span>tests completed</span></div><div><b>${Math.round((state.best||0)*100)}%</b><span>best test</span></div></section><h2 class="sectionTitle">Subject progress</h2><section class="progressGrid">${subjectStats.map(([id,s,all,d,p])=>`<article class="progressCard"><div><span>${s.icon}</span><div><b>${s.title}</b><small>${d}/${all} revised</small></div><strong>${p}%</strong></div><div class="wideBar"><i style="width:${p}%"></i></div><button class="mini" onclick="subjectPage('${id}')">Open subject →</button></article>`).join('')}</section><section class="panel recommendation"><h2>Next up</h2><p>These are currently among your least-revised subjects.</p><div class="recommendRows">${weak.map(([id,s,,d,p])=>`<button onclick="subjectPage('${id}')"><span>${s.icon}</span><b>${s.title}</b><small>${p}% revised</small> →</button>`).join('')}</div></section>`;
}
function profile(){
 const u=window.gqGoogleUser;
 if(!u){app.innerHTML=`<section class="head"><div class="pill">ACCOUNT</div><h1>Sign in</h1><p>Sign in with Google to keep your revision progress and personalisation across devices.</p></section><section class="authChoices"><button class="googleBtn" onclick="signInGoogle()"><span>G</span> Continue with Google</button><div class="panel"><h3>Why sign in?</h3><p>Your topic progress, XP and personalisation can be linked to your account. You can still browse without signing in.</p></div></section>`;return;}
 const initials=(u.displayName||'S').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
 app.innerHTML=`<section class="head"><div class="pill">PROFILE</div><h1>${esc(u.displayName||'Student')}</h1><p>Your GCSEQuest account keeps your revision progress and personalisation available across devices.</p></section>
 <section class="profileOverview"><article class="panel profileCard"><div class="avatar">${esc(initials)}</div><h2>${esc(u.displayName||'Student')}</h2><p>${esc(u.email||'Google account')}</p><div class="profileStats"><span><b>${state.xp.toLocaleString()}</b>XP</span><span><b>${state.tests}</b>Tests</span></div><button class="primary" onclick="openPersonalise()">⚙ Personalise GCSEQuest</button><button class="ghost" onclick="dashboard()">My Revision →</button><button class="ghost" onclick="signOutGoogle()">Sign out</button></article>
 <article class="panel profileWelcome"><span class="eyebrow">YOUR EXPERIENCE</span><h2>Make GCSEQuest yours.</h2><p>Choose a colour scheme, font, display style and study sound. Your settings preview immediately, then Save changes stores them to your account.</p><div class="quickPrefs"><div><b>Theme</b><span>${esc(settings.theme)}</span></div><div><b>Font</b><span>${esc(settings.font)}</span></div><div><b>Sound</b><span>${esc(settings.sound)}</span></div></div><button class="ghost" onclick="openPersonalise()">Open personalisation →</button></article></section>
 <section class="panel feedback"><h2>Suggest an idea</h2><p>Have an improvement for GCSEQuest?</p><a class="primaryLink" href="mailto:25HorneF@lancing.org.uk?subject=GCSEQuest%20suggestion">Email Fox Horne →</a></section>`;
}
function openPersonalise(){
 closePersonalise();
 const themeOptions=[['cream','Cream & Black','Warm, clean and premium'],['midnight','Midnight','Dark charcoal and silver'],['stone','Stone','Soft grey and cream'],['paper','Paper','Bright white and minimal'],['contrast','High Contrast','Maximum readability']];
 const fontOptions=[['Inter','Inter'],['Arial','Arial'],['Poppins','Poppins'],['Georgia','Georgia'],['Times New Roman','Times New Roman']];
 const modeOptions=[['light','Light'],['dark','Dark'],['auto','System']];
 const densityOptions=[['comfortable','Comfortable'],['compact','Compact']];
 const animOptions=[['on','On'],['off','Off']];
 const yearOptions=[['10','Year 10'],['11','Year 11']];
 const soundOptions=[['off','Off','No sound'],['study','Study ambience','Soft room tone'],['rain','Rain','Natural rainfall'],['waves','Plane','Aircraft ambience']];
 const choice=(group,opts,current,labels=false)=>opts.map(o=>`<button type="button" class="choice ${String(current)===o[0]?'selected':''}" data-group="${group}" data-value="${o[0]}" onclick="pickSetting(this)"><b>${esc(o[1])}</b>${labels&&o[2]?`<small>${esc(o[2])}</small>`:''}</button>`).join('');
 const modal=document.createElement('div');modal.id='personaliseModal';modal.className='modalBackdrop';modal.innerHTML=`<div class="settingsModal" role="dialog" aria-modal="true"><div class="modalTop"><div><span class="eyebrow">PERSONALISATION</span><h2>Make GCSEQuest yours</h2></div><button class="closeModal" onclick="closePersonalise()" aria-label="Close">×</button></div><div class="modalBody">
 <section class="modalSection"><h3>Colour scheme</h3><div class="choiceGrid themeChoices">${choice('theme',themeOptions,settings.theme,true)}</div></section>
 <section class="modalSection"><h3>Font</h3><div class="choiceGrid fontChoices">${choice('font',fontOptions,settings.font)}</div></section>
 <section class="modalSection"><h3>Display</h3><div class="choiceGrid three">${choice('mode',modeOptions,settings.mode)}${choice('density',densityOptions,settings.density)}${choice('animations',animOptions,settings.animations?'on':'off')}</div></section>
 <section class="modalSection"><h3>Default revision year</h3><div class="choiceGrid two">${choice('defaultYear',yearOptions,String(settings.defaultYear))}</div></section>
 <section class="modalSection"><h3>Study sounds</h3><div class="choiceGrid soundChoices">${choice('sound',soundOptions,settings.sound,true)}</div><div class="volumeLine"><label for="setVolume">Volume</label><input id="setVolume" type="range" min="0" max="1" step="0.05" value="${settings.volume}" oninput="previewVolume(this.value)"><output id="volumeValue">${Math.round(settings.volume*100)}%</output></div><p class="sourceNote">Optional built-in ambience. Tap a sound to preview it.</p></section>
 </div><div class="modalBottom"><span id="settingsStatus" class="saveStatus">No changes yet</span><button class="ghost" onclick="closePersonalise()">Cancel</button><button class="primary" onclick="savePersonalSettings()">Save changes</button></div></div>`;
 document.body.appendChild(modal);document.body.classList.add('modalOpen');
 modal.addEventListener('click',e=>{if(e.target===modal)closePersonalise();});
}
function closePersonalise(){const m=document.getElementById('personaliseModal');if(m)m.remove();document.body.classList.remove('modalOpen');}
function pickSetting(btn){const group=btn.dataset.group,value=btn.dataset.value;settings[group]=group==='defaultYear'?Number(value):group==='animations'?value==='on':value;document.querySelectorAll(`.choice[data-group="${group}"]`).forEach(x=>x.classList.toggle('selected',x===btn));applySettings(false);if(group==='sound')playStudySound();markSettingsDirty();}
function previewVolume(v){settings.volume=Number(v);const out=document.getElementById('volumeValue');if(out)out.textContent=Math.round(settings.volume*100)+'%';if(studyAudio)studyAudio.setVolume(settings.volume);markSettingsDirty();}
function markSettingsDirty(){const el=document.getElementById('settingsStatus');if(el){el.textContent='Unsaved changes';el.classList.add('dirty');}}
async function savePersonalSettings(){
 applySettings(false);save();
 const status=document.getElementById('settingsStatus');
 try{if(window.gqSaveSettings)await window.gqSaveSettings();if(status){status.textContent='Saved ✓';status.classList.remove('dirty');}toast('Changes saved to your account ✓');setTimeout(()=>{closePersonalise();profile();},500);}
 catch(e){console.error(e);if(status){status.textContent='Saved on this device';status.classList.add('dirty');}toast('Saved on this device — account sync failed');}
}
function pickSetting(btn){const group=btn.dataset.group,value=btn.dataset.value;settings[group]=group==='defaultYear'?Number(value):group==='animations'?value==='on':value;document.querySelectorAll(`.choice[data-group="${group}"]`).forEach(x=>x.classList.toggle('selected',x===btn));applySettings(false);if(group==='sound')playStudySound();markSettingsDirty();}
function previewVolume(v){settings.volume=Number(v);document.getElementById('volumeValue').textContent=Math.round(settings.volume*100)+'%';if(studyAudio)studyAudio.setVolume(settings.volume);markSettingsDirty();}
function markSettingsDirty(){const el=document.getElementById('settingsStatus');if(el){el.textContent='Unsaved changes';el.classList.add('dirty');}}
async function savePersonalSettings(){
 applySettings(false);save();
 const status=document.getElementById('settingsStatus');
 try{if(window.gqSaveSettings)await window.gqSaveSettings();if(status){status.textContent='Saved ✓';status.classList.remove('dirty');}toast('Changes saved to your account ✓');}
 catch(e){console.error(e);if(status){status.textContent='Saved on this device';status.classList.add('dirty');}toast('Saved on this device — account sync failed');}
}
function changeSetting(k,v){settings[k]=v;applySettings(false);markSettingsDirty();}
function changeSound(v){settings.sound=v;applySettings(false);playStudySound();markSettingsDirty();}
function playStudySound(){
 if(studyAudio){studyAudio.stop();studyAudio=null;}
 if(settings.sound==='off')return;
 const files={study:'sounds/study-ambience.wav',rain:'sounds/rain.wav',waves:'sounds/plane.wav'};
 const src=files[settings.sound];if(!src)return;
 const audio=new Audio(src);audio.loop=true;audio.volume=Math.max(0,Math.min(1,Number(settings.volume)||0));audio.preload='auto';
 const p=audio.play();if(p&&p.catch)p.catch(e=>{console.warn('Audio playback blocked',e);toast('Tap the sound again to start it.');});
 studyAudio={setVolume(v){audio.volume=Math.max(0,Math.min(1,Number(v)||0));},stop(){audio.pause();audio.currentTime=0;}};
 toast(`${settings.sound==='rain'?'Rain':settings.sound==='waves'?'Plane':'Study ambience'} started 🎧`);
}
function changeThemeQuick(theme){settings.theme=theme;applySettings(false);profile();}

</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,getDocs,collection,query,where,limit,updateDoc} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
let auth=null,db=null,ready=false;
const weekKey=()=>{const d=new Date(),one=new Date(Date.UTC(d.getUTCFullYear(),0,1));return `${d.getUTCFullYear()}-W${Math.ceil((((d-one)/86400000)+one.getUTCDay()+1)/7)}`;};
const cleanName=u=>String(u?.displayName||'Student').trim().slice(0,60)||'Student';
async function syncPublic(u,extra={}){
 if(!u||!db)return;
 const total=typeof totalSubs==='function'?totalSubs():0;
 const revised=Object.values(state.progress||{}).filter(Boolean).length;
 const wk=weekKey();
 const payload={
  displayName:cleanName(u),photoURL:u.photoURL||'',xp:Number(state.xp)||0,
  weeklyXP:Number(extra.weeklyXP)||0,weekKey:extra.weekKey||wk,subjectXP:extra.subjectXP||{},
  tests:Number(state.tests)||0,best:Number(state.best)||0,revisedCount:revised,totalSubtopics:total,
  progressPct:total?Math.round(revised/total*100):0,updatedAt:Date.now()
 };
 await setDoc(doc(db,'publicUsers',u.uid),payload,{merge:true});
}
try{const appFb=initializeApp(firebaseConfig);auth=getAuth(appFb);db=getFirestore(appFb);ready=true;onAuthStateChanged(auth,async u=>{window.gqGoogleUser=u||null;const b=document.querySelector('.profileBtn');if(b)b.textContent=u?`👤 ${u.displayName||'Signed in'}`:'Sign in / Profile';if(u){try{const snap=await getDoc(doc(db,'users',u.uid));if(snap.exists()){const d=snap.data();if(d.progress)state.progress={...state.progress,...d.progress};if(d.settings)settings={...settings,...d.settings};if(typeof d.xp==='number')state.xp=d.xp;if(typeof d.tests==='number')state.tests=d.tests;if(typeof d.best==='number')state.best=d.best;save();applySettings(false);await syncPublic(u,{weeklyXP:d.weeklyXP,weekKey:d.weekKey,subjectXP:d.subjectXP});}else{await setDoc(doc(db,'users',u.uid),{displayName:cleanName(u),xp:Number(state.xp)||0,weeklyXP:0,weekKey:weekKey(),subjectXP:{},progress:state.progress||{},tests:state.tests||0,best:state.best||0,settings,updatedAt:Date.now()},{merge:true});await syncPublic(u);}}catch(e){console.warn('Could not load saved progress',e);}if(document.querySelector('.authChoices'))profile();}});}catch(e){console.error(e);}
window.signInGoogle=async()=>{if(!ready){toast('Firebase is not configured');return;}try{toast('Opening Google sign-in…');await signInWithPopup(auth,new GoogleAuthProvider());profile();}catch(e){console.error(e);toast(`Google sign-in error: ${e.code||e.message}`);}};
window.signOutGoogle=async()=>{if(auth)await signOut(auth);profile();};
window.gqSaveSettings=async()=>{const u=window.gqGoogleUser;if(!u||!db)return;const snap=await getDoc(doc(db,'users',u.uid));const d=snap.exists()?snap.data():{};await setDoc(doc(db,'users',u.uid),{displayName:cleanName(u),xp:Number(state.xp)||0,weeklyXP:Number(d.weeklyXP)||0,weekKey:d.weekKey||weekKey(),subjectXP:d.subjectXP||{},progress:state.progress||{},tests:state.tests||0,best:state.best||0,settings,updatedAt:Date.now()},{merge:true});await syncPublic(u,{weeklyXP:d.weeklyXP,weekKey:d.weekKey,subjectXP:d.subjectXP});};
window.gqSaveProgress=async()=>{const u=window.gqGoogleUser;if(!u||!db)return;try{const old=await getDoc(doc(db,'users',u.uid));const d=old.exists()?old.data():{};await setDoc(doc(db,'users',u.uid),{displayName:cleanName(u),xp:Number(state.xp)||0,weeklyXP:Number(d.weeklyXP)||0,weekKey:d.weekKey||weekKey(),subjectXP:d.subjectXP||{},progress:state.progress,settings,tests:state.tests||0,best:state.best||0,updatedAt:Date.now()},{merge:true});await syncPublic(u,{weeklyXP:d.weeklyXP,weekKey:d.weekKey,subjectXP:d.subjectXP});}catch(e){console.warn('Progress sync failed',e);}};
window.gqRecordTest=async(xp,subject)=>{const u=window.gqGoogleUser;if(!u||!db)return;try{const ref=doc(db,'users',u.uid),snap=await getDoc(ref),d=snap.exists()?snap.data():{};const wk=weekKey();const weekly=(d.weekKey===wk?Number(d.weeklyXP)||0:0)+Number(xp||0);const subjectXP={...(d.subjectXP||{})};subjectXP[subject]=Number(subjectXP[subject]||0)+Number(xp||0);await setDoc(ref,{displayName:cleanName(u),xp:Number(state.xp)||0,weeklyXP:weekly,weekKey:wk,subjectXP,progress:state.progress||{},tests:state.tests||0,best:state.best||0,settings,updatedAt:Date.now()},{merge:true});await syncPublic(u,{weeklyXP:weekly,weekKey:wk,subjectXP});}catch(e){console.warn('Score sync failed',e);}};
window.gqGetLeaderboard=async(mode='all')=>{if(!db)throw new Error('Firebase unavailable');const snap=await getDocs(collection(db,'publicUsers'));const wk=weekKey();return snap.docs.map(d=>{const x=d.data()||{};let score=Number(x.xp)||0;if(mode==='week')score=x.weekKey===wk?Number(x.weeklyXP)||0:0;else if(mode!=='all')score=Number((x.subjectXP||{})[mode])||0;return {uid:d.id,displayName:x.displayName||'Student',photoURL:x.photoURL||'',score};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);};
window.gqSearchUsers=async(term)=>{if(!db)throw new Error('Firebase unavailable');const snap=await getDocs(collection(db,'publicUsers'));const t=term.toLowerCase();return snap.docs.map(d=>({uid:d.id,...d.data()})).filter(x=>(x.displayName||'').toLowerCase().includes(t)).sort((a,b)=>(a.displayName||'').localeCompare(b.displayName||'')).slice(0,20);};
window.gqGetPublicProfile=async(uid)=>{if(!db)throw new Error('Firebase unavailable');const snap=await getDoc(doc(db,'publicUsers',uid));if(!snap.exists())return null;const rows=await window.gqGetLeaderboard('all');const d=snap.data();return {...d,uid,rank:rows.findIndex(x=>x.uid===uid)+1||null};};
window.gqSendFriendRequest=async(uid)=>{const me=window.gqGoogleUser;if(!me||!db)throw new Error('Sign in first');if(uid===me.uid)throw new Error('You cannot add yourself');const id=[me.uid,uid].sort().join('_');const ref=doc(db,'friendships',id);if((await getDoc(ref)).exists())throw new Error('You are already friends');const requests=await getDocs(query(collection(db,'friendRequests'),where('senderId','==',me.uid),where('receiverId','==',uid),where('status','==','pending'),limit(1)));if(!requests.empty)throw new Error('Request already sent');await setDoc(doc(db,'friendRequests',`${me.uid}_${uid}`),{senderId:me.uid,receiverId:uid,senderName:cleanName(me),status:'pending',createdAt:Date.now()});};

window.gqGetSocial=async()=>{const me=window.gqGoogleUser;if(!me||!db)throw new Error('Sign in first');const incomingSnap=await getDocs(query(collection(db,'friendRequests'),where('receiverId','==',me.uid),where('status','==','pending')));const friendsSnap=await getDocs(query(collection(db,'friendships'),where('members','array-contains',me.uid)));const friends=[];for(const d of friendsSnap.docs){const x=d.data()||{};const uid=(x.members||[]).find(v=>v!==me.uid);if(uid){const ps=await getDoc(doc(db,'publicUsers',uid));if(ps.exists())friends.push({uid,...ps.data()});}}return {incoming:incomingSnap.docs.map(d=>({id:d.id,...d.data()})),friends};};
window.gqAcceptFriendRequest=async(id)=>{const me=window.gqGoogleUser;if(!me||!db)throw new Error('Sign in first');const req=doc(db,'friendRequests',id),snap=await getDoc(req);if(!snap.exists())throw new Error('Request no longer exists');const r=snap.data();if(r.receiverId!==me.uid)throw new Error('Not your request');const friendshipId=[r.senderId,r.receiverId].sort().join('_');await setDoc(doc(db,'friendships',friendshipId),{members:[r.senderId,r.receiverId],createdAt:Date.now()});await updateDoc(req,{status:'accepted'});};
</script>
